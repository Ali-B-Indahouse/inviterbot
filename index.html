<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Сканер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        #reader {
            width: 320px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a2e;
            border: 2px solid #ff6b6b;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #1a1a2e;
            min-height: 60px;
            text-align: center;
            max-width: 320px;
        }
        .btn {
            margin-top: 20px;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            background: #ff6b6b;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 8px;">📸 Сканер QR</h2>
    <p style="color: #aaa; margin-top: 0; font-size: 14px;">Наведите на QR-код</p>
    <div id="reader"></div>
    <div id="status">⏳ Загрузка камеры...</div>
    <button id="restartBtn" class="btn hidden">🔄 Сканировать снова</button>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        let html5QrCode = null;
        let isScanning = false;

        function startScanner() {
            const statusEl = document.getElementById('status');
            const restartBtn = document.getElementById('restartBtn');

            if (html5QrCode) {
                html5QrCode.clear();
                html5QrCode = null;
            }

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 15,
                qrbox: { width: 240, height: 240 },
                aspectRatio: 1.0
            };

            statusEl.textContent = '📷 Запуск камеры...';
            statusEl.style.color = '#ffd93d';
            restartBtn.classList.add('hidden');

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                function onScanSuccess(decodedText) {
                    if (!isScanning) return;
                    isScanning = false;

                    if (html5QrCode) {
                        html5QrCode.stop().catch(() => {});
                    }

                    statusEl.textContent = '✅ QR распознан! Отправка...';
                    statusEl.style.color = '#6bcb77';

                    // Пытаемся отправить в Telegram
                    if (window.Telegram && window.Telegram.WebApp) {
                        try {
                            window.Telegram.WebApp.sendData(JSON.stringify({
                                qr_data: decodedText,
                                timestamp: Date.now()
                            }));
                            statusEl.textContent = '✅ Отправлено!';
                            setTimeout(() => window.Telegram.WebApp.close(), 1000);
                            return;
                        } catch(e) {
                            console.error('Send error:', e);
                        }
                    }

                    // Если не получилось отправить — показываем текст и кнопку
                    statusEl.innerHTML = `✅ Распознано: <br><strong style="font-size:14px;color:#ffd93d;">${decodedText}</strong><br><br>⚠️ Не удалось отправить в бота.<br>Нажмите "Сканировать снова" и попробуйте ещё раз.`;
                    statusEl.style.color = '#ffd93d';
                    restartBtn.classList.remove('hidden');
                    restartBtn.textContent = '🔄 Попробовать снова';
                },
                function onScanError(err) {
                    if (err && err.includes('NotFoundException')) return;
                    if (isScanning) {
                        console.log('Scan error:', err);
                    }
                }
            ).then(() => {
                isScanning = true;
                statusEl.textContent = '✅ Камера активна. Наведите на QR.';
                statusEl.style.color = '#6bcb77';
                restartBtn.classList.add('hidden');
            }).catch((err) => {
                statusEl.textContent = '❌ Ошибка камеры: ' + (err.message || 'проверьте разрешения');
                statusEl.style.color = '#ff6b6b';
                restartBtn.classList.remove('hidden');
                restartBtn.textContent = '🔄 Попробовать снова';
            });
        }

        document.getElementById('restartBtn').addEventListener('click', function() {
            startScanner();
        });

        // Принудительно просим Telegram активировать WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        startScanner();
    </script>
</body>
</html>
