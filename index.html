<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        #reader {
            width: 320px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a2e;
            border: 2px solid #ff6b6b;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #1a1a2e;
            min-height: 60px;
            text-align: center;
            max-width: 320px;
            word-break: break-all;
        }
        .btn {
            margin-top: 20px;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            background: #ff6b6b;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .hidden { display: none; }
        .status-success { color: #6bcb77; }
        .status-error { color: #ff6b6b; }
        .status-warning { color: #ffd93d; }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 8px;">📸 Сканер QR</h2>
    <p style="color: #aaa; margin-top: 0; font-size: 14px;">Наведите на QR-код</p>
    <div id="reader"></div>
    <div id="status">⏳ Загрузка камеры...</div>
    <button id="restartBtn" class="btn hidden">🔄 Сканировать снова</button>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        // =====================================================
        // ⚙️ ПЕРЕМЕННЫЕ ЗАМЕНЯЮТСЯ ПРИ ДЕПЛОЕ ЧЕРЕЗ GITHUB ACTIONS
        // Используем __МАРКЕРЫ__ для замены через sed
        // =====================================================
        const BOT_TOKEN = '__BOT_TOKEN__';
        const CHAT_ID = '__CHAT_ID__';

        let html5QrCode = null;
        let isScanning = false;
        let USER_ID = null;

        // =====================================================
        // 🔥 ПОЛУЧАЕМ ID ПОЛЬЗОВАТЕЛЯ ИЗ TELEGRAM
        // =====================================================
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            USER_ID = window.Telegram.WebApp.initDataUnsafe?.user?.id;
            console.log('👤 USER_ID:', USER_ID);
        }

        // =====================================================
        // 🔍 ДИАГНОСТИКА
        // =====================================================
        console.log('🔑 BOT_TOKEN:', BOT_TOKEN === '__BOT_TOKEN__' ? '❌ НЕ УСТАНОВЛЕН' : '✅ установлен');
        console.log('💬 CHAT_ID:', CHAT_ID === '__CHAT_ID__' ? '❌ НЕ УСТАНОВЛЕН' : CHAT_ID);
        console.log('👤 USER_ID из Telegram:', USER_ID || '❌ не получен');

        // Определяем куда отправлять
        let targetChatId = USER_ID || CHAT_ID;
        if (!targetChatId || targetChatId === '__CHAT_ID__') {
            console.warn('⚠️ CHAT_ID не найден! Используем USER_ID');
            targetChatId = USER_ID;
        }
        console.log('📤 Будет отправлено в чат:', targetChatId || '❌ НЕ НАЙДЕН');

        function updateStatus(text, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = text;
            statusEl.className = type || '';
        }

        function startScanner() {
            const statusEl = document.getElementById('status');
            const restartBtn = document.getElementById('restartBtn');

            if (html5QrCode) {
                html5QrCode.clear();
                html5QrCode = null;
            }

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 10,
                qrbox: { width: 240, height: 240 },
                aspectRatio: 1.0
            };

            updateStatus('📷 Запуск камеры...', 'status-warning');
            restartBtn.classList.add('hidden');

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                function onScanSuccess(decodedText) {
                    if (!isScanning) return;
                    isScanning = false;

                    updateStatus('✅ QR распознан! Отправка...', 'status-success');

                    if (html5QrCode) {
                        html5QrCode.stop().then(() => {
                            sendDataToBot(decodedText);
                        }).catch(() => {
                            sendDataToBot(decodedText);
                        });
                    } else {
                        sendDataToBot(decodedText);
                    }
                },
                function onScanError(err) {
                    // Игнорируем ошибки сканирования
                }
            ).then(() => {
                isScanning = true;
                updateStatus('✅ Камера активна. Наведите на QR.', 'status-success');
                restartBtn.classList.add('hidden');
            }).catch((err) => {
                updateStatus('❌ Ошибка камеры: ' + (err.message || 'проверьте разрешения'), 'status-error');
                restartBtn.classList.remove('hidden');
                restartBtn.textContent = '🔄 Попробовать снова';
            });
        }

        function sendDataToBot(decodedText) {
            const statusEl = document.getElementById('status');
            const restartBtn = document.getElementById('restartBtn');

            // =====================================================
            // 🚀 СПОСОБ 1: ЧЕРЕЗ TELEGRAM WebApp (ОСНОВНОЙ)
            // =====================================================
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
                try {
                    const payload = JSON.stringify({
                        qr_data: decodedText,
                        timestamp: Date.now(),
                        user_id: USER_ID
                    });
                    window.Telegram.WebApp.sendData(payload);
                    updateStatus('✅ Отправлено в бот!', 'status-success');
                    console.log('📤 Отправлено через WebApp:', payload);
                    
                    setTimeout(() => {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.close();
                        }
                    }, 2000);
                    return;
                } catch(e) {
                    console.error('❌ sendData error:', e);
                }
            }

            // =====================================================
            // 🔄 СПОСОБ 2: ЧЕРЕЗ HTTP (РЕЗЕРВНЫЙ)
            // =====================================================
            if (!BOT_TOKEN || BOT_TOKEN === '__BOT_TOKEN__') {
                updateStatus('❌ Ошибка: BOT_TOKEN не настроен', 'status-error');
                restartBtn.classList.remove('hidden');
                restartBtn.textContent = '🔄 Попробовать снова';
                return;
            }

            const chatId = targetChatId;
            if (!chatId) {
                updateStatus('❌ Не найден ID чата для отправки', 'status-error');
                restartBtn.classList.remove('hidden');
                restartBtn.textContent = '🔄 Попробовать снова';
                return;
            }

            const payload = {
                qr_data: decodedText,
                timestamp: Date.now(),
                user_id: USER_ID
            };

            console.log('📤 HTTP отправка в чат:', chatId);

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: `/scan_result ${JSON.stringify(payload)}`,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('📬 HTTP ответ:', data);
                if (data.ok) {
                    updateStatus('✅ QR отправлен!', 'status-success');
                    setTimeout(() => {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.close();
                        }
                    }, 2000);
                } else {
                    updateStatus('❌ Ошибка: ' + (data.description || 'неизвестная'), 'status-error');
                    restartBtn.classList.remove('hidden');
                    restartBtn.textContent = '🔄 Попробовать снова';
                }
            })
            .catch(error => {
                console.error('❌ HTTP error:', error);
                updateStatus('❌ Ошибка сети: ' + error.message, 'status-error');
                restartBtn.classList.remove('hidden');
                restartBtn.textContent = '🔄 Попробовать снова';
            });
        }

        document.getElementById('restartBtn').addEventListener('click', function() {
            startScanner();
        });

        // =====================================================
        // 🚀 ЗАПУСК
        // =====================================================
        console.log('📱 Mini App URL:', window.location.href);
        startScanner();
    </script>
</body>
</html>
