<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Сканер</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        #reader {
            width: 320px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a2e;
            border: 2px solid #ff6b6b;
            position: relative;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #1a1a2e;
            min-height: 60px;
            text-align: center;
            max-width: 320px;
        }
        .btn {
            margin-top: 20px;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            background: #ff6b6b;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e05a5a;
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 8px;">📸 Сканер QR</h2>
    <p style="color: #aaa; margin-top: 0; font-size: 14px;">Наведите на QR-код</p>
    <div id="reader"></div>
    <div id="status">⏳ Загрузка камеры...</div>
    <button id="restartBtn" class="btn" style="display: none;">🔄 Сканировать снова</button>

    <script>
        // Подключаем библиотеку для сканирования (используем html5-qrcode)
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = initScanner;
        document.head.appendChild(script);

        let html5QrCode = null;
        let isScanning = false;

        function initScanner() {
            const statusEl = document.getElementById('status');
            const restartBtn = document.getElementById('restartBtn');

            // Проверяем, что мы в Telegram WebView
            const isTelegram = window.Telegram !== undefined && window.Telegram.WebApp !== undefined;
            if (isTelegram) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            function startScanner() {
                if (html5QrCode) {
                    html5QrCode.clear();
                    html5QrCode = null;
                }

                // Создаём сканер
                html5QrCode = new Html5Qrcode("reader");

                const config = {
                    fps: 15,
                    qrbox: { width: 240, height: 240 },
                    aspectRatio: 1.0
                };

                statusEl.textContent = '📷 Запуск камеры...';
                statusEl.style.color = '#ffd93d';

                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanError
                ).then(() => {
                    isScanning = true;
                    statusEl.textContent = '✅ Камера активна. Наведите на QR.';
                    statusEl.style.color = '#6bcb77';
                    restartBtn.style.display = 'none';
                }).catch((err) => {
                    console.error('Ошибка камеры:', err);
                    statusEl.textContent = '❌ Не удалось запустить камеру: ' + (err.message || 'проверьте разрешения');
                    statusEl.style.color = '#ff6b6b';
                    restartBtn.style.display = 'block';
                    restartBtn.textContent = '🔄 Попробовать снова';
                });
            }

            function onScanSuccess(decodedText) {
                if (!isScanning) return;
                isScanning = false;

                // Останавливаем сканер
                if (html5QrCode) {
                    html5QrCode.stop().catch(() => {});
                }

                statusEl.textContent = '✅ QR распознан!';
                statusEl.style.color = '#6bcb77';

                // Отправляем результат в Telegram
                const data = {
                    qr_data: decodedText,
                    timestamp: Date.now()
                };

                // Отправляем боту через WebApp
                if (window.Telegram && window.Telegram.WebApp) {
                    // Данные уходят в бот через sendData
                    window.Telegram.WebApp.sendData(JSON.stringify(data));
                    
                    // Закрываем приложение через 2 секунды
                    setTimeout(() => {
                        window.Telegram.WebApp.close();
                    }, 1500);
                } else {
                    // Если не в Telegram — показываем результат
                    statusEl.innerHTML = `✅ Распознано: <strong>${decodedText}</strong>`;
                    restartBtn.style.display = 'block';
                    restartBtn.textContent = '🔄 Сканировать снова';
                }
            }

            function onScanError(err) {
                // Игнорируем обычные ошибки сканирования (это нормально, пока камера ищет)
                if (err && err.includes('NotFoundException')) return;
                if (isScanning) {
                    console.log('Scan error:', err);
                }
            }

            // Кнопка перезапуска
            restartBtn.addEventListener('click', () => {
                restartBtn.style.display = 'none';
                startScanner();
            });

            // Запускаем сканер при загрузке
            startScanner();
        }

        // Обработка ошибок, если библиотека не загрузилась
        setTimeout(() => {
            if (!window.Html5Qrcode) {
                document.getElementById('status').textContent = '❌ Ошибка загрузки сканера. Проверьте интернет.';
                document.getElementById('status').style.color = '#ff6b6b';
            }
        }, 5000);
    </script>
</body>
</html>
