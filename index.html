<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Сканер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        #reader {
            width: 320px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a2e;
            border: 2px solid #ff6b6b;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #1a1a2e;
            min-height: 60px;
            text-align: center;
            max-width: 320px;
        }
        .btn {
            margin-top: 20px;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary {
            background: #ff6b6b;
            color: #fff;
        }
        .btn-success {
            background: #6bcb77;
            color: #fff;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .data-box {
            margin-top: 16px;
            padding: 12px;
            background: #1a1a2e;
            border-radius: 8px;
            max-width: 320px;
            word-break: break-all;
            font-size: 14px;
            color: #ffd93d;
        }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 8px;">📸 Сканер QR</h2>
    <p style="color: #aaa; margin-top: 0; font-size: 14px;">Наведите на QR-код</p>
    <div id="reader"></div>
    <div id="status">⏳ Загрузка камеры...</div>
    <div id="resultBox" class="data-box" style="display: none;"></div>
    <button id="restartBtn" class="btn btn-primary" style="display: none;">🔄 Сканировать снова</button>
    <button id="copyBtn" class="btn btn-success" style="display: none;">📋 Копировать данные</button>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        let html5QrCode = null;
        let isScanning = false;
        let lastDecodedText = '';

        function startScanner() {
            const statusEl = document.getElementById('status');
            const restartBtn = document.getElementById('restartBtn');
            const copyBtn = document.getElementById('copyBtn');
            const resultBox = document.getElementById('resultBox');

            if (html5QrCode) {
                html5QrCode.clear();
                html5QrCode = null;
            }

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 15,
                qrbox: { width: 240, height: 240 },
                aspectRatio: 1.0
            };

            statusEl.textContent = '📷 Запуск камеры...';
            statusEl.style.color = '#ffd93d';
            restartBtn.style.display = 'none';
            copyBtn.style.display = 'none';
            resultBox.style.display = 'none';

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                function onScanSuccess(decodedText) {
                    if (!isScanning) return;
                    isScanning = false;

                    if (html5QrCode) {
                        html5QrCode.stop().catch(() => {});
                    }

                    lastDecodedText = decodedText;
                    statusEl.textContent = '✅ QR распознан!';
                    statusEl.style.color = '#6bcb77';

                    // Показываем результат
                    resultBox.textContent = '📋 ' + decodedText;
                    resultBox.style.display = 'block';
                    copyBtn.style.display = 'block';
                    restartBtn.style.display = 'block';
                    restartBtn.textContent = '🔄 Сканировать снова';

                    // Пытаемся отправить в Telegram (если работает)
                    if (window.Telegram && window.Telegram.WebApp) {
                        try {
                            window.Telegram.WebApp.sendData(JSON.stringify({
                                qr_data: decodedText,
                                timestamp: Date.now()
                            }));
                            setTimeout(() => window.Telegram.WebApp.close(), 1500);
                        } catch(e) {
                            console.log('WebApp send error:', e);
                        }
                    }
                },
                function onScanError(err) {
                    if (err && err.includes('NotFoundException')) return;
                    if (isScanning) {
                        console.log('Scan error:', err);
                    }
                }
            ).then(() => {
                isScanning = true;
                statusEl.textContent = '✅ Камера активна. Наведите на QR.';
                statusEl.style.color = '#6bcb77';
            }).catch((err) => {
                statusEl.textContent = '❌ Ошибка камеры: ' + (err.message || 'проверьте разрешения');
                statusEl.style.color = '#ff6b6b';
                restartBtn.style.display = 'block';
                restartBtn.textContent = '🔄 Попробовать снова';
            });
        }

        // Копирование в буфер
        document.getElementById('copyBtn').addEventListener('click', function() {
            if (lastDecodedText) {
                navigator.clipboard.writeText(lastDecodedText).then(() => {
                    alert('✅ Данные скопированы!\n\nВставьте их в бот командой /check_manual');
                }).catch(() => {
                    // Если clipboard не работает
                    const textarea = document.createElement('textarea');
                    textarea.value = lastDecodedText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('✅ Данные скопированы!\n\nВставьте их в бот командой /check_manual');
                });
            }
        });

        // Перезапуск сканера
        document.getElementById('restartBtn').addEventListener('click', function() {
            startScanner();
        });

        // Автозапуск
        startScanner();
    </script>
</body>
</html>
