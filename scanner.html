<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        /* ... ваши стили ... */
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="overlay"></div>
    </div>
    
    <div id="status" class="loading">📸 Наведите камеру на QR-код...</div>
    
    <div id="controls">
        <button onclick="restartScanner()">🔄 Повторить</button>
        <button class="secondary" onclick="closeApp()">❌ Закрыть</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        let stream = null;
        let scanning = false;
        
        function updateStatus(text, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = type;
        }
        
        function sendViaWebApp(qrData) {
            try {
                Telegram.sendData(JSON.stringify({
                    action: 'scan',
                    qr_data: qrData
                }));
                updateStatus('✅ Данные отправлены!', 'success');
                setTimeout(() => Telegram.close(), 1500);
            } catch (error) {
                updateStatus('❌ Ошибка: ' + error.message, 'error');
            }
        }
        
        async function startScanner() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 640 }
                    }
                });
                video.srcObject = stream;
                await video.play();
                
                updateStatus('📸 Сканирование...', 'loading');
                scanning = true;
                
                const scanLoop = () => {
                    if (!scanning) return;
                    
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            const qrData = code.data;
                            updateStatus(`✅ QR найден!`, 'success');
                            
                            scanning = false;
                            if (stream) {
                                stream.getTracks().forEach(track => track.stop());
                            }
                            
                            sendViaWebApp(qrData);
                            return;
                        }
                    }
                    requestAnimationFrame(scanLoop);
                };
                
                scanLoop();
            } catch (error) {
                updateStatus('❌ Ошибка камеры: ' + error.message, 'error');
                console.error('Ошибка:', error);
            }
        }
        
        function restartScanner() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            scanning = false;
            updateStatus('🔄 Перезапуск...', 'loading');
            setTimeout(() => startScanner(), 500);
        }
        
        function closeApp() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            scanning = false;
            Telegram.close();
        }
        
        Telegram.ready();
        Telegram.expand();
        setTimeout(startScanner, 500);
    </script>
</body>
</html>
