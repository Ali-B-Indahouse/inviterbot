<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        h2 { text-align: center; margin-bottom: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
        #status { text-align: center; margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 10px; }
        .btn { display: block; width: 100%; max-width: 400px; margin: 10px auto; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-danger { background: #cc3333; color: white; }
        .btn-primary { background: #2481cc; color: white; }
        .btn-secondary { background: #555; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>📸 QR Сканер</h2>
    <div id="reader"></div>
    <div id="status">🔄 Запуск камеры...</div>
    
    <button class="btn btn-success hidden" id="confirmBtn" onclick="confirmScan()">
        ✅ Подтвердить сканирование
    </button>
    <button class="btn btn-secondary" onclick="restartScanner()" id="restartBtn" style="display:none;">
        🔄 Сканировать ещё
    </button>
    <button class="btn btn-danger" onclick="closeApp()">
        ❌ Закрыть
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('chat');

        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('chat');
        const SERVER_URL = urlParams.get('server'); // ← берём адрес сервера из URL

        if (!SERVER_URL) {
            updateStatus('❌ Ошибка: не передан адрес сервера');
            throw new Error('SERVER_URL не передан');
        }

        let html5QrCode = null;
        let isScanning = false;
        let scannedData = null;

        function updateStatus(text) {
            document.getElementById('status').innerText = text;
        }

        function confirmScan() {
            if (!scannedData) {
                updateStatus('❌ Нет данных для отправки');
                return;
            }

            updateStatus('⏳ Отправка...');

            fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    qr_data: scannedData,
                    chat_id: CHAT_ID
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateStatus('✅ Отмечен!');
                    setTimeout(() => tg.close(), 1000);
                } else {
                    updateStatus('❌ ' + (data.error || 'Ошибка'));
                }
            })
            .catch(err => {
                updateStatus('❌ Ошибка соединения: ' + err);
                console.error(err);
            });
        }

        function startScanner() {
            updateStatus('🔄 Запуск камеры...');
            html5QrCode = new Html5Qrcode("reader");
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    const cameraId = devices.find(d => /back|rear|environment/i.test(d.label))?.id || devices[devices.length - 1].id;
                    html5QrCode.start(
                        cameraId,
                        { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                        onScanSuccess,
                        onScanFailure
                    ).then(() => {
                        isScanning = true;
                        updateStatus('📷 Наведите на QR-код');
                        document.getElementById('restartBtn').style.display = 'none';
                    }).catch(err => {
                        updateStatus('❌ Ошибка камеры: ' + err);
                    });
                } else {
                    updateStatus('❌ Камера не найдена');
                }
            }).catch(err => {
                updateStatus('❌ ' + err);
            });
        }

        function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;
            scannedData = decodedText;
            updateStatus('✅ QR найден! Нажмите "Подтвердить"');
            document.getElementById('confirmBtn').classList.remove('hidden');
            if (html5QrCode) {
                html5QrCode.stop().catch(e => console.error(e));
            }
            document.getElementById('restartBtn').style.display = 'block';
        }

        function onScanFailure(error) { /* игнорируем */ }

        function restartScanner() {
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('confirmBtn').classList.add('hidden');
            scannedData = null;
            startScanner();
        }

        function closeApp() {
            if (html5QrCode && isScanning) html5QrCode.stop().catch(e => console.error(e));
            tg.close();
        }

        startScanner();
    </script>
</body>
</html>
