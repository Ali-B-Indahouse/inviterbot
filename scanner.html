<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #1a1a1a; color: white; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: #2481cc; color: white; }
        .btn-danger { background: #cc3333; color: white; }
        #status { text-align: center; margin: 15px 0; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">📸 QR Сканер</h2>
    <div id="reader"></div>
    <div id="status">Запуск камеры...</div>
    <button class="btn btn-danger" onclick="closeApp()">❌ Закрыть</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let html5QrCode = null;
        let isScanning = false;

        function startScanner() {
            document.getElementById('status').innerText = '🔄 Запуск камеры...';
            
            html5QrCode = new Html5Qrcode("reader");
            
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    // Ищем заднюю камеру
                    const cameraId = devices.find(d => /back|rear|environment/i.test(d.label))?.id || devices[devices.length - 1].id;
                    
                    html5QrCode.start(
                        cameraId,
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        onScanSuccess
                    ).then(() => {
                        isScanning = true;
                        document.getElementById('status').innerText = '📷 Наведите на QR-код';
                    }).catch(err => {
                        document.getElementById('status').innerText = '❌ Ошибка камеры: ' + err;
                    });
                } else {
                    document.getElementById('status').innerText = '❌ Камера не найдена';
                }
            }).catch(err => {
                document.getElementById('status').innerText = '❌ ' + err;
            });
        }

        function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;
            
            document.getElementById('status').innerText = '✅ Считано: ' + decodedText;
            
            // 🔑 ОТПРАВКА ДАННЫХ В БОТА — САМОЕ ВАЖНОЕ!
            const payload = JSON.stringify({
                action: 'scan',
                qr_data: decodedText
            });
            
            console.log('📤 Отправляем в бота:', payload);
            
            try {
                tg.sendData(payload);
                document.getElementById('status').innerText = '📤 Данные отправлены боту...';
                
                // Останавливаем сканер
                if (html5QrCode && isScanning) {
                    html5QrCode.stop().catch(e => console.error(e));
                }
                
                // Закрываем Mini App через 1.5 сек
                setTimeout(() => tg.close(), 1500);
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка отправки: ' + e;
                console.error(e);
            }
        }

        function closeApp() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().catch(e => console.error(e));
            }
            tg.close();
        }

        // Запуск при загрузке
        startScanner();
    </script>
</body>
</html>
