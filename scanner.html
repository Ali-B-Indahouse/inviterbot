<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
        #status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
            font-size: 14px;
            word-break: break-all;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-danger { background: #cc3333; color: white; }
        .btn-primary { background: #2481cc; color: white; }
        .btn-secondary { background: #555; color: white; }
        .log-area {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h2>📸 QR Сканер</h2>
    <div id="reader"></div>
    <div id="status">🔄 Запуск камеры...</div>
    
    <button class="btn btn-secondary" onclick="toggleTorch()" id="torchBtn" style="display:none;">💡 Подсветка</button>
    <button class="btn btn-primary" onclick="restartScanner()" id="restartBtn" style="display:none;">🔄 Сканировать ещё</button>
    <button class="btn btn-danger" onclick="closeApp()">❌ Закрыть</button>

    <div class="log-area" id="log"></div>

    <script>
        // ============================================================
        // 📱 ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ============================================================
        // 🔑 ПОЛУЧАЕМ ТОКЕН И CHAT_ID ИЗ URL (передаются ботом)
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const BOT_TOKEN = urlParams.get('token');
        const CHAT_ID = urlParams.get('chat');

        // Логирование
        function addLog(msg) {
            console.log(msg);
            const logDiv = document.getElementById('log');
            logDiv.textContent += msg + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
            document.getElementById('status').innerText = msg;
        }

        if (!BOT_TOKEN || !CHAT_ID) {
            addLog('❌ Ошибка: не получены параметры авторизации');
            throw new Error('Missing token or chat_id');
        }
        addLog('✅ Параметры получены');

        // ============================================================
        // ОТПРАВКА ЧЕРЕЗ HTTP (безопасно, токен из URL)
        // ============================================================
        function sendViaHTTP(qrData) {
            addLog('📤 Отправка через HTTP...');
            const payload = {
                chat_id: CHAT_ID,
                text: `/scan_result ${JSON.stringify({ qr_data: qrData })}`
            };

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    addLog('✅ Успешно отправлено!');
                    setTimeout(() => tg.close(), 1500);
                } else {
                    addLog('❌ Ошибка: ' + data.description);
                }
            })
            .catch(err => {
                addLog('❌ Ошибка fetch: ' + err);
            });
        }

        // ============================================================
        // СКАНЕР QR
        // ============================================================
        let html5QrCode = null;
        let isScanning = false;
        let torchEnabled = false;

        function startScanner() {
            addLog('🔄 Запуск камеры...');
            html5QrCode = new Html5Qrcode("reader");
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    const cameraId = devices.find(d => /back|rear|environment/i.test(d.label))?.id || devices[devices.length - 1].id;
                    addLog(`📷 Камера: ${cameraId}`);
                    html5QrCode.start(
                        cameraId,
                        { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                        onScanSuccess,
                        onScanFailure
                    ).then(() => {
                        isScanning = true;
                        addLog('📷 Наведите на QR-код');
                        document.getElementById('torchBtn').style.display = 'block';
                        document.getElementById('restartBtn').style.display = 'none';
                    }).catch(err => {
                        addLog('❌ Ошибка камеры: ' + err);
                    });
                } else {
                    addLog('❌ Камера не найдена');
                }
            }).catch(err => {
                addLog('❌ ' + err);
            });
        }

        function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;
            addLog(`✅ QR распознан: ${decodedText}`);
            if (html5QrCode) {
                html5QrCode.stop().catch(e => console.error(e));
            }
            // Отправляем через HTTP
            sendViaHTTP(decodedText);
            document.getElementById('restartBtn').style.display = 'block';
            document.getElementById('torchBtn').style.display = 'none';
        }

        function onScanFailure(error) {
            // игнорируем
        }

        function toggleTorch() {
            if (!html5QrCode) return;
            torchEnabled = !torchEnabled;
            const btn = document.getElementById('torchBtn');
            html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchEnabled }] })
                .then(() => {
                    btn.innerText = torchEnabled ? '💡 Выключить' : '💡 Подсветка';
                })
                .catch(() => {
                    torchEnabled = false;
                });
        }

        function restartScanner() {
            document.getElementById('restartBtn').style.display = 'none';
            startScanner();
        }

        function closeApp() {
            if (html5QrCode && isScanning) html5QrCode.stop().catch(e => console.error(e));
            tg.close();
        }

        // Запуск
        startScanner();
    </script>
</body>
</html>
