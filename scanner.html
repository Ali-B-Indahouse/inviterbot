<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
        #status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
            font-size: 14px;
            word-break: break-all;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-danger { background: #cc3333; color: white; }
        .btn-primary { background: #2481cc; color: white; }
        .btn-secondary { background: #555; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>📸 QR Сканер</h2>
    <div id="reader"></div>
    <div id="status">🔄 Запуск камеры...</div>
    
    <button class="btn btn-success hidden" id="confirmBtn" onclick="confirmScan()">
        ✅ Подтвердить сканирование
    </button>
    <button class="btn btn-secondary" onclick="restartScanner()" id="restartBtn" style="display:none;">
        🔄 Сканировать ещё
    </button>
    <button class="btn btn-danger" onclick="closeApp()">
        ❌ Закрыть
    </button>

    <script>
        // ============================================================
        // 📱 ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let html5QrCode = null;
        let isScanning = false;
        let scannedData = null;

        function updateStatus(text) {
            document.getElementById('status').innerText = text;
        }

        // ============================================================
        // ОТПРАВКА ДАННЫХ ЧЕРЕЗ WebApp (по клику пользователя)
        // ============================================================
        function confirmScan() {
            if (!scannedData) {
                updateStatus('❌ Нет данных для отправки');
                return;
            }
            try {
                tg.sendData(JSON.stringify({
                    action: 'scan',
                    qr_data: scannedData
                }));
                updateStatus('✅ Данные отправлены!');
                document.getElementById('confirmBtn').classList.add('hidden');
                setTimeout(() => tg.close(), 1000);
            } catch (e) {
                updateStatus('❌ Ошибка отправки: ' + e.message);
                console.error(e);
            }
        }

        // ============================================================
        // СКАНЕР QR
        // ============================================================
        function startScanner() {
            updateStatus('🔄 Запуск камеры...');
            html5QrCode = new Html5Qrcode("reader");
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    const cameraId = devices.find(d => /back|rear|environment/i.test(d.label))?.id || devices[devices.length - 1].id;
                    html5QrCode.start(
                        cameraId,
                        { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                        onScanSuccess,
                        onScanFailure
                    ).then(() => {
                        isScanning = true;
                        updateStatus('📷 Наведите на QR-код');
                        document.getElementById('restartBtn').style.display = 'none';
                    }).catch(err => {
                        updateStatus('❌ Ошибка камеры: ' + err);
                    });
                } else {
                    updateStatus('❌ Камера не найдена');
                }
            }).catch(err => {
                updateStatus('❌ ' + err);
            });
        }

        function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;
            scannedData = decodedText;
            updateStatus('✅ QR найден! Нажмите "Подтвердить"');
            document.getElementById('confirmBtn').classList.remove('hidden');
            if (html5QrCode) {
                html5QrCode.stop().catch(e => console.error(e));
            }
            document.getElementById('restartBtn').style.display = 'block';
        }

        function onScanFailure(error) {
            // игнорируем
        }

        function restartScanner() {
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('confirmBtn').classList.add('hidden');
            scannedData = null;
            startScanner();
        }

        function closeApp() {
            if (html5QrCode && isScanning) html5QrCode.stop().catch(e => console.error(e));
            tg.close();
        }

        // Запуск
        startScanner();
    </script>
</body>
</html>
