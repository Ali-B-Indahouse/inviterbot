<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест отправки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Тест отправки</h1>
    <button onclick="sendTest()">📤 Отправить тестовые данные</button>
    <div id="status"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        document.getElementById('status').innerText = 'WebApp готов';

        function sendTest() {
            const payload = JSON.stringify({
                action: 'scan',
                qr_data: 'USER_Test_User_EVENT_2026'
            });
            console.log('Отправка:', payload);
            try {
                tg.sendData(payload);
                document.getElementById('status').innerText = '✅ Данные отправлены!';
                setTimeout(() => tg.close(), 1000);
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка: ' + e;
                console.error(e);
            }
        }
    </script>
</body>
</html>
